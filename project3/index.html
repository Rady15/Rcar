<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مجموعة الرفقة لتأجير السيارات | ALRAFGHA GROUP</title>
    <meta name="description" content="أفضل خدمات تأجير السيارات في المملكة العربية السعودية مع مجموعة الرفقة. أسطول 2025 حديث، فروع في كافة المطارات، حجز فوري وأسعار منافسة." />
    <link rel="icon" type="image/png" href="/arafgha-logo.png" />
    <link rel="apple-touch-icon" href="/arafgha-logo.png" />
    <meta name="theme-color" content="#C9922C" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="مجموعة الرفقة لتأجير السيارات" />
    <meta property="og:title" content="مجموعة الرفقة لتأجير السيارات" />
    <meta property="og:description" content="تأجير سيارات وحجز إلكتروني في المملكة العربية السعودية." />
    <link rel="canonical" href="__SITE_URL__/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      #initial-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FBF9F5;transition:opacity .45s ease,visibility .45s}
      #initial-loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
      .il-car{width:160px;height:90px;position:relative;perspective:700px;display:flex;flex-direction:column;align-items:center;justify-content:center}
      .il-body{position:relative;width:100%;height:64%;display:flex;align-items:center;justify-content:center;animation:il-bounce 1.1s ease-in-out infinite}
      .il-wheel{position:absolute;bottom:6%;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#3a332e 0%,#1C1917 55%,#0e0c0a 100%);border:2px solid #C9922C;display:flex;align-items:center;justify-content:center;overflow:hidden}
      .il-wheel.front{right:14%}.il-wheel.rear{left:14%}
      .il-wheel i{width:62%;height:62%;border-radius:50%;border:1.5px dashed rgba(223,171,68,.9);display:block;animation:il-spin .45s linear infinite}
      .il-road{position:absolute;left:4%;right:4%;bottom:0;height:10px;background:linear-gradient(90deg,#1C1917 0%,#2A2520 50%,#1C1917 100%);border-radius:999px;overflow:hidden}
      .il-road-line{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 18px,#DFAB44 18px 34px);animation:il-road .55s linear infinite}
      @keyframes il-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes il-spin{to{transform:rotate(360deg)}}
      @keyframes il-road{from{background-position:0 0}to{background-position:52px 0}}
    </style>
  </head>
  <body class="bg-[#FBF9F5] text-[#231F20] antialiased selection:bg-[#C9922C] selection:text-white font-sans">
    <div id="initial-loader" aria-live="polite" aria-label="Loading">
      <div class="il-car">
        <div class="il-body">
          <svg width="88" height="54" viewBox="0 0 120 60" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 10px 14px rgba(28,25,23,.18))">
            <ellipse cx="60" cy="56" rx="42" ry="6" fill="#1C1917" opacity="0.12"/>
            <path d="M12 28 L18 18 L42 16 L52 16 L66 16 L84 18 L96 22 L106 28 L106 38 L96 42 L84 42 L66 42 L42 42 L24 42 L12 38 Z" fill="#1C1917" stroke="#C9922C" stroke-width="1.8"/>
            <path d="M20 28 L24 20 L42 18 L52 18 L64 18 L82 20 L95 26 L102 28" fill="#2A2520" stroke="#C9922C" stroke-width="1.2"/>
            <path d="M26 28 L30 20 L42 19 L42 28 Z" fill="#DFAB44" opacity="0.95"/><path d="M44 28 L44 19 L64 19 L68 28 Z" fill="#DFAB44" opacity="0.95"/><path d="M70 28 L66 19 L83 20 L92 27 Z" fill="#DFAB44" opacity="0.85"/>
            <rect x="14" y="31" width="90" height="2.5" rx="1.2" fill="#C9922C" opacity="0.95"/>
            <ellipse cx="104.5" cy="32.5" rx="2.8" ry="3.5" fill="#DFAB44"/><ellipse cx="104.5" cy="32.5" rx="1.2" ry="1.8" fill="#FFF8E1" opacity="0.9"/>
          </svg>
          <div class="il-wheel front"><i></i></div>
          <div class="il-wheel rear"><i></i></div>
        </div>
        <div class="il-road"><div class="il-road-line"></div></div>
      </div>
      <p style="margin-top:14px;font-size:11px;font-weight:900;letter-spacing:.14em;color:#A47018;text-transform:uppercase;animation:il-bounce 1.1s ease-in-out infinite">مجموعة الرفقة</p>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', function(){ setTimeout(function(){ var el=document.getElementById('initial-loader'); if(el) el.classList.add('hidden'); }, 600); });
      // Fallback: hide after React mounts (if load already fired)
      setTimeout(function(){ var el=document.getElementById('initial-loader'); if(el && !el.classList.contains('hidden')) el.classList.add('hidden'); }, 3500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
